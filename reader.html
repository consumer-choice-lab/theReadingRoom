<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your order</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <span class="brand" id="brand">The Reading Room</span>
    <button class="basket-btn" id="doneBtn" type="button">Confirm my order</button>
  </div>
</header>
<main id="app">
  <div class="intro" id="intro"></div>
  <section class="plan" id="plan" aria-live="polite"></section>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="decide" id="decide"></div>
  <div id="pane"></div>
  <p class="note warn" id="note"></p>
</main>
<script src="config.js"></script>
<script src="catalogue.js"></script>
<script src="reader.js"></script>
</body>
</html>
